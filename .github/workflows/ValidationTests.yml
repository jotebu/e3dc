name: Validation Tests

on: [push, pull_request]

jobs:

  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install PHPUnit 12
      run: wget -O phpunit.phar https://phar.phpunit.de/phpunit-12.phar

    - name: Run Tests
      run: phpdbg -qrr phpunit.phar tests
